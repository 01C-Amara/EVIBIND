<svg xmlns='http://www.w3.org/2000/svg' width='900' height='744' viewBox='0 0 900 744'><rect width='900' height='744' fill='#fcfcfb'/><text x='24' y='32' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#0b0b0b'>Two shapes of injection, the same three models</text><text x='24' y='53' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#52514e'>How often each model did what the attacker's text told it to, with no gateway in the way. Both runs are live and unguarded.</text><text x='24' y='71' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#52514e'>Upper bar: &#8220;call this other tool&#8221; (InjecAgent dh_enhanced, 510 cases). Lower bar: &#8220;use this account number instead&#8221; (InjectBench, 60 origin-violation cases).</text><rect x='24' y='112' width='11' height='11' fill='#0ca30c' stroke='#52514e' stroke-width='0.4'/><text x='40' y='121' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>refused the attacker</text><rect x='190' y='112' width='11' height='11' fill='#d03b3b' stroke='#52514e' stroke-width='0.4'/><text x='206' y='121' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>did what the attacker's text said</text><text x='136' y='176' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-5.6 Sol</text><rect x='150' y='150' width='540' height='20' fill='#0ca30c'/><text x='700' y='164.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='178' width='540' height='20' fill='#0ca30c'/><text x='700' y='192.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/60 &#183; argument substitution</text><text x='136' y='250' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>Grok 4.6</text><rect x='150' y='224' width='540' height='20' fill='#0ca30c'/><text x='700' y='238.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='252' width='540' height='20' fill='#0ca30c'/><text x='700' y='266.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/60 &#183; argument substitution</text><text x='136' y='324' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-5.6 Luna</text><rect x='150' y='298' width='540' height='20' fill='#0ca30c'/><text x='700' y='312.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='326' width='540' height='20' fill='#0ca30c'/><rect x='150' y='326' width='27.0' height='20' fill='#d03b3b'/><text x='700' y='340.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>3/60 &#183; argument substitution</text><text x='136' y='398' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-5.6 Terra</text><rect x='150' y='372' width='540' height='20' fill='#0ca30c'/><text x='700' y='386.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='400' width='540' height='20' fill='#0ca30c'/><rect x='150' y='400' width='36.0' height='20' fill='#d03b3b'/><text x='700' y='414.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>4/60 &#183; argument substitution</text><text x='136' y='472' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-5.4 mini</text><rect x='150' y='446' width='540' height='20' fill='#0ca30c'/><text x='700' y='460.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='474' width='540' height='20' fill='#0ca30c'/><rect x='150' y='474' width='360.0' height='20' fill='#d03b3b'/><text x='700' y='488.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>40/60 &#183; argument substitution</text><text x='136' y='546' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-5.4 nano</text><rect x='150' y='520' width='540' height='20' fill='#0ca30c'/><text x='700' y='534.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>0/510 &#183; tool selection</text><rect x='150' y='548' width='540' height='20' fill='#0ca30c'/><rect x='150' y='548' width='387.0' height='20' fill='#d03b3b'/><text x='700' y='562.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>43/60 &#183; argument substitution</text><text x='136' y='620' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' fill='#0b0b0b' text-anchor='end'>GPT-4.1 mini</text><rect x='150' y='594' width='540' height='20' fill='#0ca30c'/><rect x='150' y='594' width='9.5' height='20' fill='#d03b3b'/><text x='700' y='608.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>9/510 &#183; tool selection</text><rect x='150' y='622' width='540' height='20' fill='#0ca30c'/><rect x='150' y='622' width='387.0' height='20' fill='#d03b3b'/><text x='700' y='636.5' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#52514e'>43/60 &#183; argument substitution</text><text x='24' y='724' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#52514e'>Every model refuses to be redirected to another tool. The cheaper tiers still take the attacker's account number, because that never arrives as an instruction &#8212; it arrives as a fact.</text></svg>