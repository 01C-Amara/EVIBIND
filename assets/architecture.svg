<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <rect width="880" height="240" fill="#fcfcfb"/>
  <text x="24" y="34" font-size="16" font-weight="600" fill="#0b0b0b">Where the gateway sits</text>

  <!-- app -->
  <rect x="24" y="70" width="150" height="96" rx="12" fill="none" stroke="#52514e" stroke-width="2"/>
  <text x="99" y="110" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Your agent</text>
  <text x="99" y="130" font-size="12" fill="#52514e" text-anchor="middle">OpenAI client,</text>
  <text x="99" y="146" font-size="12" fill="#52514e" text-anchor="middle">base_url swapped</text>

  <line x1="174" y1="118" x2="224" y2="118" stroke="#52514e" stroke-width="2"/>
  <path d="M 224 118 l -9 -5 v 10 z" fill="#52514e"/>

  <!-- gateway -->
  <rect x="226" y="54" width="420" height="128" rx="14" fill="none" stroke="#2a78d6" stroke-width="3"/>
  <text x="436" y="80" font-size="14" font-weight="700" fill="#2a78d6" text-anchor="middle">EviBind gateway</text>
  <rect x="246" y="94" width="116" height="66" rx="10" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="304" y="120" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">1 - compile</text>
  <text x="304" y="138" font-size="11.5" fill="#52514e" text-anchor="middle">evidence table</text>
  <rect x="378" y="94" width="116" height="66" rx="10" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <text x="436" y="120" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">2 - model binds</text>
  <text x="436" y="138" font-size="11.5" fill="#52514e" text-anchor="middle">no critical literal</text>
  <rect x="510" y="94" width="116" height="66" rx="10" fill="none" stroke="#1baf7a" stroke-width="2"/>
  <text x="568" y="120" font-size="12.5" font-weight="600" fill="#0b0b0b" text-anchor="middle">3 - replay + release</text>
  <text x="568" y="138" font-size="11.5" fill="#52514e" text-anchor="middle">or fail closed</text>

  <line x1="646" y1="118" x2="696" y2="118" stroke="#52514e" stroke-width="2"/>
  <path d="M 696 118 l -9 -5 v 10 z" fill="#52514e"/>

  <!-- provider -->
  <rect x="698" y="70" width="158" height="96" rx="12" fill="none" stroke="#52514e" stroke-width="2"/>
  <text x="777" y="106" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Any provider</text>
  <text x="777" y="126" font-size="12" fill="#52514e" text-anchor="middle">OpenAI - OpenRouter</text>
  <text x="777" y="142" font-size="12" fill="#52514e" text-anchor="middle">xAI - vLLM - Ollama</text>

  <text x="24" y="216" font-size="12" fill="#52514e">Untrusted content can propose; only trusted replay materializes an executable critical value. Certificates logged per release.</text>
</svg>
