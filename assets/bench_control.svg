<svg xmlns='http://www.w3.org/2000/svg' width='940' height='500' viewBox='0 0 940 500'><rect width='940' height='500' fill='#fcfcfb'/><text x='24' y='32' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='17' font-weight='600' fill='#0b0b0b'>What the gateway structurally prevents - worst-case selector, 150 cases</text><text x='24' y='52' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#52514e'>A scripted model that always emits the engineered wrong value. Each row: 15 cases, outcome after the gateway.</text><text x='24' y='72' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#52514e'>Origin violations are repaired or fail closed; selection errors are not the boundary's job and pass through.</text><rect x='290' y='92' width='10' height='10' rx='3' fill='#0ca30c'/><text x='305' y='101' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#52514e'>repaired to intended call</text><rect x='490' y='92' width='10' height='10' rx='3' fill='#b5b3ac'/><text x='505' y='101' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#52514e'>withheld - fail closed</text><rect x='690' y='92' width='10' height='10' rx='3' fill='#d03b3b'/><text x='705' y='101' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#52514e'>still wrong - not confined</text><text x='24' y='133' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#52514e' letter-spacing='0.5'>ORIGIN VIOLATION</text><text x='278' y='133' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>injected instruction</text><rect x='290.0' y='118' width='528.0' height='21' rx='4' fill='#0ca30c'/><text x='555.0' y='133' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='163' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>injected data field</text><rect x='290.0' y='148' width='528.0' height='21' rx='4' fill='#0ca30c'/><text x='555.0' y='163' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='193' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>forged authority</text><rect x='290.0' y='178' width='528.0' height='21' rx='4' fill='#0ca30c'/><text x='555.0' y='193' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='223' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>user defers to tool</text><rect x='290.0' y='208' width='528.0' height='21' rx='4' fill='#b5b3ac'/><text x='555.0' y='223' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#0b0b0b' text-anchor='middle'>15</text><text x='24' y='269' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' fill='#52514e' letter-spacing='0.5'>SELECTION ERROR</text><text x='278' y='269' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>stale after correction</text><rect x='290.0' y='254' width='528.0' height='21' rx='4' fill='#d03b3b'/><text x='555.0' y='269' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='299' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>ambiguous request</text><rect x='290.0' y='284' width='528.0' height='21' rx='4' fill='#d03b3b'/><text x='555.0' y='299' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='329' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>swapped slots</text><rect x='290.0' y='314' width='528.0' height='21' rx='4' fill='#d03b3b'/><text x='555.0' y='329' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='359' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>near-duplicate distractors</text><rect x='290.0' y='344' width='528.0' height='21' rx='4' fill='#d03b3b'/><text x='555.0' y='359' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='278' y='389' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>garbled long identifier</text><rect x='290.0' y='374' width='528.0' height='21' rx='4' fill='#b5b3ac'/><text x='555.0' y='389' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#0b0b0b' text-anchor='middle'>15</text><text x='278' y='419' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#0b0b0b' text-anchor='end'>explicitly forbidden value</text><rect x='290.0' y='404' width='528.0' height='21' rx='4' fill='#d03b3b'/><text x='555.0' y='419' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' fill='#ffffff' text-anchor='middle'>15</text><text x='24' y='480' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#52514e'>60/60 origin violations neutralised (45 repaired to the user-authorised value, 15 withheld); garbled identifiers also caught.</text></svg>