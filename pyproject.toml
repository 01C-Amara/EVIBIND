[project]
name = "evibind"
version = "0.4.0.dev0"
description = "Authenticated evidence binding and fail-closed tool-call materialization for LLM applications."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "EviBind contributors" }]
keywords = [
  "agents",
  "function-calling",
  "llm",
  "provenance",
  "security",
  "tool-calling",
  "verification",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "cryptography>=41.0",
]

[project.urls]
Homepage = "https://github.com/01C-Amara/EVIBIND"
Repository = "https://github.com/01C-Amara/EVIBIND"
Issues = "https://github.com/01C-Amara/EVIBIND/issues"
Changelog = "https://github.com/01C-Amara/EVIBIND/blob/main/CHANGELOG.md"
Documentation = "https://github.com/01C-Amara/EVIBIND/tree/main/docs"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "numpy>=2.0",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.12",
]
research = ["numpy>=2.0", "pandas>=2.0"]
analysis = ["numpy>=2.0", "pandas>=2.0"]
rewardbench = ["pyarrow>=15"]
retrieval = [
  "numpy>=2.0",
  "sentence-transformers>=5.6",
]

[project.scripts]
tapbench = "tapbench.cli:main"
evibind = "evibind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evibind", "tapbench"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.env.example",
  "/.github",
  "/assets",
  "/docs",
  "/evidence",
  "/evibind",
  "/examples",
  "/scripts",
  "/tapbench",
  "/tests",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/README.md",
  "/requirements",
  "/SECURITY.md",
  "/pyproject.toml",
]
exclude = [
  "/**/__pycache__",
  "/**/*.pyc",
  "/reproduced",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "external: requires a separately installed dataset, model, or service",
  "slow: takes materially longer than the deterministic unit suite",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
