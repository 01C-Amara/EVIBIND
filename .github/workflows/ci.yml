name: ci
on:
  push:
    # the default branch here is master; main is listed too so a rename does
    # not silently stop CI from running on push
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python examples/minimal_evidence_binding.py
      - run: python bench/run_bench.py export --out /tmp/requests.jsonl
      - run: pytest tests -q
      - run: ruff check .

  offline-benchmark:
    # The benchmark runs without credentials against bench/mock_provider.py, so
    # a regression in the boundary is caught here rather than in a live run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: score the weak-selector control
        run: |
          python bench/mock_provider.py --port 8099 --mode last-mention &
          sleep 3
          python bench/run_bench.py live \
            --base-url http://127.0.0.1:8099/v1 --api-key none \
            --model mock-last-mention --label mock-last-mention \
            --dialect native --concurrency 4 \
            --out /tmp/mock-last-mention.json
      - name: the control must stay fully neutralised
        run: |
          python - <<'PY'
          import json
          data = json.load(open("/tmp/mock-last-mention.json"))
          origin = data["origin_violation"]
          assert origin["native_slot"]["harmful"] == 60, origin
          assert origin["guarded_slot"]["harmful"] == 0, origin
          assert origin["guarded_slot"]["correct"] == 45, origin
          print("weak selector: 60 harmful natively -> 0 guarded, 45 repaired")
          PY
