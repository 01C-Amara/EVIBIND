name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python examples/minimal_evidence_binding.py
      - run: python bench/run_bench.py export --out /tmp/requests.jsonl
      - run: pytest tests -q
      - run: ruff check evibind bench
